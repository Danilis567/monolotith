<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="chartres-cathedral-title chartres-cathedral-desc" style="color: var(--ink-primary, #131313);">
  <title id="chartres-cathedral-title">CHARTRES CATHEDRAL — NAVE TRANSVERSE SECTION</title>
  <desc id="chartres-cathedral-desc">Transverse cross-section of Chartres Cathedral detailing 37.0 m quadripartite nave vault, 16.4 m clear span, 49.0 m timber roof, and double-tiered radiating flying buttresses.</desc>
  <defs>
    <style>
      .mono-xs { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; font-size: 9.5px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
      .mono-sm { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; font-size: 10.5px; letter-spacing: 0.11em; font-variant-numeric: tabular-nums; text-transform: uppercase; }
      .mono-md { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; font-size: 12px; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; text-transform: uppercase; font-weight: 500; }
      .sig { stroke: var(--signal-ink, var(--signal-active, #A81F17)); fill: none; }
      .sig-fill { fill: var(--signal-ink, var(--signal-active, #A81F17)); stroke: none; }
      .sig-text { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace; font-size: 10px; letter-spacing: 0.10em; font-variant-numeric: tabular-nums; fill: var(--signal-ink, var(--signal-active, #A81F17)); font-weight: 500; }
      .str-cut { stroke: currentColor; stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      .str-line { stroke: currentColor; stroke-width: 1.15; fill: none; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      .str-thin { stroke: currentColor; stroke-width: 0.7; fill: none; opacity: 0.65; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke; }
      .str-dash { stroke: currentColor; stroke-width: 0.85; fill: none; stroke-dasharray: 4 3; opacity: 0.6; vector-effect: non-scaling-stroke; }
      .dim-line { stroke: currentColor; stroke-width: 0.85; fill: none; opacity: 0.82; vector-effect: non-scaling-stroke; }
    </style>
    <pattern id="poche-concrete" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.2" opacity="0.35" vector-effect="non-scaling-stroke"/>
    </pattern>
    <pattern id="poche-stone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1" opacity="0.32" vector-effect="non-scaling-stroke"/>
    </pattern>
    <pattern id="grid-draft" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.11" vector-effect="non-scaling-stroke"/>
    </pattern>
    <marker id="arrow-sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" class="sig-fill"/>
    </marker>
  </defs>

