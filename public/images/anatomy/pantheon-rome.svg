<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="pantheon-rome-title pantheon-rome-desc" style="color: var(--ink-primary, #131313);">
  <title id="pantheon-rome-title">PANTHEON — LONGITUDINAL SECTION &amp; INSCRIBED SPHERE</title>
  <desc id="pantheon-rome-desc">Longitudinal orthographic section of the Pantheon in Rome detailing the 43.3 m unreinforced concrete rotunda, 8.2 m oculus, 6.4 m drum walls, 5 stepped exterior rings, and octastyle portico.</desc>
