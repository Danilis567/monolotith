    </pattern>
    <marker id="arrow-sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" class="sig-fill"/>
    </marker>
  </defs>

